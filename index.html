<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Shop UI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .btn-custom {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 15px 25px;
            margin: 10px 0;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        .btn-danger-custom {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }
    </style>
</head>
<body>

    <h2>🎮 Snake Engine Panel</h2>
    <p>اختر الخدمة المطلوبة بتصميم تفاعلي فائق:</p>

    <button class="btn-custom" onclick="sendDataToBot('8ball')">🎱 شحن 8Ball Pool</button>
    <button class="btn-custom" onclick="sendDataToBot('deposit')">💵 إيداع رصيد USDT</button>
    <button class="btn-custom btn-danger-custom" onclick="closeApp()">❌ إغلاق الواجهة</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function sendDataToBot(item) {
            tg.sendData(item);
        }

        function closeApp() {
            tg.close();
        }
    </script>
</body>
</html>
